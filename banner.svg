<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060d"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }
      .blink { animation: b 1.1s steps(1) infinite; }
      @keyframes b { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- circuit traces (right side) -->
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".55">
    <path d="M820 60H930L960 90H1120"/>
    <path d="M860 150H990L1020 120H1140"/>
    <path d="M800 240H950L980 210H1100"/>
    <path d="M960 90V210"/>
  </g>
  <g fill="#a855f7">
    <circle cx="820" cy="60" r="5"/><circle cx="1120" cy="90" r="5"/>
    <circle cx="860" cy="150" r="5"/><circle cx="1140" cy="120" r="5"/>
    <circle cx="800" cy="240" r="5"/><circle cx="1100" cy="210" r="5"/>
  </g>
  <!-- chip -->
  <g transform="translate(1000 135)">
    <rect x="-46" y="-36" width="92" height="72" rx="8" fill="#0d0a18" stroke="#a855f7" stroke-width="2"/>
    <text class="t" x="0" y="7" text-anchor="middle" font-size="18" fill="#c4b5fd">MIPS</text>
  </g>

  <!-- terminal text -->
  <text class="t" x="70" y="95" font-size="20" fill="#8b5cf6">doggo@nightscry:~$ whoami</text>
  <text class="t" x="70" y="160" font-size="52" font-weight="700" fill="#f5f3ff">doggoAngel</text>
  <text class="t" x="70" y="205" font-size="22" fill="#c4b5fd">Penetration Tester · Embedded &amp; IoT Security</text>
  <text class="t" x="70" y="245" font-size="18" fill="#7c7a91">web · api · mobile · reverse engineering · firmware</text>
  <rect class="blink" x="640" y="228" width="12" height="22" fill="#a855f7"/>
</svg>
